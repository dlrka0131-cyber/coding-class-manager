<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학교별 학생 연락처 일괄 자동 포맷 생성기</title>
    <style>
        /* 전체 페이지 및 배경 그라데이션 적용 */
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            background-image: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            color: #333; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 메인 카드 영역 (부드럽고 은은한 박스 섀도우) */
        .container { 
            max-width: 950px; 
            margin: 0 auto; 
            background: #fff; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            overflow: hidden;
        }

        /* 최상단 네이비 블루 헤더 영역 */
        .header-banner {
            background: #1e293b;
            color: white;
            padding: 30px 40px;
        }
        h2 { 
            margin: 0; 
            font-size: 24px; 
            font-weight: 700; 
            letter-spacing: -0.5px;
        }

        /* 내부 콘텐츠 영역 패딩 */
        .content-body {
            padding: 35px 40px;
        }

        /* 학교 탭 선택 영역 */
        .school-tabs-wrapper { position: relative; margin-bottom: 12px; }
        .school-tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .tab-btn { background: #e2e8f0; color: #475569; padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; position: relative; transition: all 0.2s; }
        .tab-btn:hover { background: #cbd5e1; }
        .tab-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .tab-add-btn { background: #8b5cf6; color: white; }
        .tab-add-btn:hover { background: #7c3aed; }

        /* 팁 박스 영역 (연한 노란색 강조) */
        .tab-guide-box {
            background: #fefce8;
            border: 1px solid #fef08a;
            color: #854d0e;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 공통 설정 컨트롤 */
        .top-controls { display: flex; gap: 20px; background: #f8fafc; padding: 20px; border-radius: 10px; margin-bottom: 25px; align-items: center; flex-wrap: wrap; border: 1px solid #e2e8f0; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        label { font-weight: 600; font-size: 14px; color: #475569; }
        input, select, textarea { padding: 10px 12px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        /* 일괄 입력 영역 */
        .batch-section { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 25px; border-radius: 12px; margin-bottom: 30px; position: relative; }
        textarea { width: 100%; height: 110px; resize: vertical; font-family: 'Consolas', monospace; margin-top: 8px; box-sizing: border-box; }
        
        /* 버튼 공통 스타일 (둥근 모서리 및 세련된 톤) */
        button { background: #3b82f6; color: white; border: none; padding: 10px 18px; font-size: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s, transform 0.1s; }
        button:hover { background: #2563eb; }
        button:active { transform: translateY(1px); }
        
        .btn-batch { background: #f97316; margin-top: 12px; }
        .btn-batch:hover { background: #ea580c; }
        .btn-csv { background: #10b981; margin-left: 6px; }
        .btn-csv:hover { background: #059669; }
        .btn-reset { background: #ef4444; }
        .btn-reset:hover { background: #dc2626; }

        /* 학교 삭제 팝업 스타일 */
        .card-popup {
            display: none;
            position: absolute;
            background: #fff;
            border: 1px solid #ef4444;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            width: 220px;
            animation: fadeIn 0.2s ease-in-out;
        }
        .card-popup::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 20px;
            width: 10px;
            height: 10px;
            background: #fff;
            border-top: 1px solid #ef4444;
            border-left: 1px solid #ef4444;
            transform: rotate(45deg);
        }
        .card-popup p { margin: 0 0 12px 0; font-size: 13px; font-weight: bold; color: #dc2626; text-align: center; }
        .popup-btns { display: flex; gap: 6px; justify-content: center; }
        .popup-btns button { padding: 6px 12px; font-size: 12px; }
        .btn-pop-del { background: #ef4444; }
        .btn-pop-del:hover { background: #dc2626; }
        .btn-pop-cancel { background: #64748b; }
        .btn-pop-cancel:hover { background: #475569; }

        /* 새 학교 추가 커스텀 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease-in-out;
        }
        .modal-card {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 340px;
            box-sizing: border-box;
        }
        .modal-card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #1e293b;
        }
        .modal-card p {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: #64748b;
        }
        .modal-card input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .modal-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .btn-modal-cancel {
            background: #e2e8f0;
            color: #475569;
        }
        .btn-modal-cancel:hover {
            background: #cbd5e1;
        }
        .btn-modal-confirm {
            background: #8b5cf6;
        }
        .btn-modal-confirm:hover {
            background: #7c3aed;
        }

        /* 입력 완료 안내 팝업 스타일 */
        .msg-popup {
            display: none;
            position: absolute;
            background: #10b981;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            z-index: 100;
            animation: fadeIn 0.2s ease-in-out;
        }
        .msg-popup::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 20px;
            width: 10px;
            height: 10px;
            background: #10b981;
            border-top: 1px solid #10b981;
            border-left: 1px solid #10b981;
            transform: rotate(45deg);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 테이블 디자인 정돈 및 행 간격 조정 */
        .result-box h3 { font-size: 18px; color: #1e293b; margin-bottom: 15px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
        th, td { padding: 12px 16px; text-align: center; font-size: 14px; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; }
        th:last-child, td:last-child { border-right: none; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #f1f5f9; }
        
        .action-btn { background: #ef4444; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
        .action-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <!-- 최상단 헤더 배너 -->
    <div class="header-banner">
        <h2>학교별 학생 연락처 일괄 자동 포맷 생성기</h2>
    </div>

    <div class="content-body">
        <!-- 학교 탭 선택 영역 -->
        <div class="school-tabs-wrapper">
            <div class="school-tabs" id="schoolTabsContainer"></div>
            <!-- 학교 삭제 커스텀 팝업 -->
            <div id="cardPopup" class="card-popup">
                <p id="popupText">학교를 삭제하시겠습니까?</p>
                <div class="popup-btns">
                    <button class="btn-pop-del" id="popupConfirmBtn">삭제</button>
                    <button class="btn-pop-cancel" onclick="closeCardPopup()">취소</button>
                </div>
            </div>
        </div>
        
        <!-- 팁 박스 (노란색 강조 및 아이콘) -->
        <div class="tab-guide-box">
            <span>💡</span>
            <div>학교 탭 버튼을 <strong>우클릭(마우스 오른쪽 클릭)</strong>하면 해당 학교를 삭제할 수 있습니다.</div>
        </div>
        
        <!-- 공통 설정 -->
        <div class="top-controls">
            <div class="control-group">
                <label for="currentSchoolName">현재 학교명:</label>
                <input type="text" id="currentSchoolName" value="세정초" oninput="updateCurrentSchoolName()" placeholder="예: 세정초">
            </div>
            <div class="control-group">
                <label for="startNo">시작 번호:</label>
                <input type="number" id="startNo" value="1" min="1" style="width: 70px;" onchange="updateStartNo()">
            </div>
            <div>
                <button class="btn-reset" onclick="clearCurrentSchoolData()">현재 학교 목록 비우기</button>
            </div>
        </div>

        <!-- 일괄 입력 영역 -->
        <div class="batch-section">
            <label for="batchData"><strong>📋 일괄 입력 (학년, 이름, 전화번호 순서)</strong></label>
            <p style="font-size: 13px; color: #64748b; margin: 6px 0 10px 0;">엑셀의 학년, 이름, 전화번호 열을 순서대로 복사해서 그대로 붙여넣으세요. (예: 1 송우주 010-5143-2757)</p>
            <textarea id="batchData" placeholder="1	송우주	010-5143-2757&#10;1	조이든	010-2479-4503&#10;1	박도윤	010-3301-6941"></textarea>
            <button id="addBtn" class="btn-batch" onclick="addBatchStudents()">현재 학교에 한번에 추가하기</button>
            
            <!-- 추가 완료 안내 팝업 -->
            <div id="msgPopup" class="msg-popup">학생이 추가되었습니다!</div>
        </div>

        <!-- 결과 테이블 -->
        <div class="result-box">
            <h3>[<span id="displaySchoolName">세정초</span>] 입력된 목록 (<span id="count">0</span>명)</h3>
            <div style="margin-bottom: 15px;">
                <button onclick="copyTable()">전체 표 복사하기</button>
                <button class="btn-csv" onclick="downloadCSV()">💾 현재 학교 CSV 파일로 저장 (조합결과, 전화번호)</button>
            </div>
            
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>학교명</th>
                        <th>학년</th>
                        <th>이름</th>
                        <th>자동 조합 결과 (#학교명학년이름)</th>
                        <th>전화번호</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 동적 생성 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 새 학교 추가 모달 팝업 -->
<div id="schoolModal" class="modal-overlay">
    <div class="modal-card">
        <h3>새 학교 추가</h3>
        <p>추가할 학교명을 입력해 주세요.</p>
        <input type="text" id="modalSchoolInput" placeholder="예: 새롬초" onkeydown="if(event.key==='Enter') confirmAddSchool()">
        <div class="modal-btns">
            <button class="btn-modal-cancel" onclick="closeSchoolModal()">취소</button>
            <button class="btn-modal-confirm" onclick="confirmAddSchool()">추가</button>
        </div>
    </div>
</div>

<script>
    // 기본 데이터 구조
    let schoolData = {
        "세정초": {
            startNo: 1,
            students: []
        }
    };
    let currentSchool = "세정초";

    // 💾 1. 저장된 데이터 불러오기 함수
    function loadData() {
        const savedData = localStorage.getItem('schoolDataContactGen');
        const savedSchool = localStorage.getItem('currentSchoolContactGen');
        
        if (savedData) {
            schoolData = JSON.parse(savedData);
        }
        if (savedSchool && schoolData[savedSchool]) {
            currentSchool = savedSchool;
        } else if (Object.keys(schoolData).length > 0) {
            currentSchool = Object.keys(schoolData)[0];
        }
    }

    // 💾 2. 데이터 저장하기 함수 (변경사항이 생길 때마다 호출됨)
    function saveData() {
        localStorage.setItem('schoolDataContactGen', JSON.stringify(schoolData));
        localStorage.setItem('currentSchoolContactGen', currentSchool);
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('schoolTabsContainer');
        tabsContainer.innerHTML = '<span style="font-weight:600; color:#475569; margin-right:4px;">학교 선택: </span>';

        for (let school in schoolData) {
            let btn = document.createElement('button');
            btn.className = `tab-btn ${school === currentSchool ? 'active' : ''}`;
            btn.innerText = school;
            
            btn.onclick = () => {
                closeAllPopups();
                switchSchool(school);
            };
            
            btn.oncontextmenu = (e) => {
                e.preventDefault();
                showCardPopup(school, btn);
            };

            tabsContainer.appendChild(btn);
        }

        let addBtn = document.createElement('button');
        addBtn.className = 'tab-btn tab-add-btn';
        addBtn.innerText = '+ 새 학교 추가';
        addBtn.onclick = () => {
            closeAllPopups();
            openSchoolModal();
        };
        tabsContainer.appendChild(addBtn);
    }

    function openSchoolModal() {
        const modal = document.getElementById('schoolModal');
        const input = document.getElementById('modalSchoolInput');
        input.value = '';
        modal.style.display = 'flex';
        input.focus();
    }

    function closeSchoolModal() {
        document.getElementById('schoolModal').style.display = 'none';
    }

    function confirmAddSchool() {
        let newName = document.getElementById('modalSchoolInput').value.trim();
        if (!newName) {
            alert("학교명을 입력해주세요.");
            return;
        }

        if (schoolData[newName]) {
            alert("이미 존재하는 학교입니다.");
            switchSchool(newName);
            closeSchoolModal();
            return;
        }

        schoolData[newName] = {
            startNo: 1,
            students: []
        };
        closeSchoolModal();
        switchSchool(newName);
        saveData(); // 데이터 저장
    }

    function showCardPopup(schoolName, btnElement) {
        closeAllPopups();
        let schoolKeys = Object.keys(schoolData);
        const popup = document.getElementById('cardPopup');
        const popupText = document.getElementById('popupText');
        const confirmBtn = document.getElementById('popupConfirmBtn');

        if (schoolKeys.length <= 1) {
            popupText.innerText = "마지막 학교는 삭제 불가";
            confirmBtn.style.display = "none";
        } else {
            popupText.innerText = `[${schoolName}] 삭제할까요?`;
            confirmBtn.style.display = "inline-block";
            confirmBtn.onclick = () => {
                deleteSpecificSchool(schoolName);
                closeAllPopups();
            };
        }

        const rect = btnElement.getBoundingClientRect();
        const containerRect = document.querySelector('.school-tabs-wrapper').getBoundingClientRect();
        
        popup.style.top = (rect.bottom - containerRect.top + 8) + 'px';
        popup.style.left = (rect.left - containerRect.left) + 'px';
        popup.style.display = 'block';
    }

    function showMsgPopup() {
        const msgPopup = document.getElementById('msgPopup');
        const addBtn = document.getElementById('addBtn');
        const rect = addBtn.getBoundingClientRect();
        const sectionRect = document.querySelector('.batch-section').getBoundingClientRect();

        msgPopup.style.top = (rect.bottom - sectionRect.top + 8) + 'px';
        msgPopup.style.left = (rect.left - sectionRect.left) + 'px';
        msgPopup.style.display = 'block';

        setTimeout(() => {
            msgPopup.style.display = 'none';
        }, 2000);
    }

    function closeAllPopups() {
        document.getElementById('cardPopup').style.display = 'none';
        document.getElementById('msgPopup').style.display = 'none';
    }

    window.onclick = function(event) {
        if (!event.target.closest('.tab-btn') && !event.target.closest('.card-popup') && !event.target.closest('.batch-section')) {
            closeAllPopups();
        }
        const modal = document.getElementById('schoolModal');
        if (event.target === modal) {
            closeSchoolModal();
        }
    };

    function switchSchool(schoolName) {
        currentSchool = schoolName;
        document.getElementById('currentSchoolName').value = schoolName;
        document.getElementById('startNo').value = schoolData[schoolName].startNo;
        renderTabs();
        renderTable();
        saveData(); // 데이터 저장
    }

    function deleteSpecificSchool(schoolName) {
        let schoolKeys = Object.keys(schoolData);
        if (schoolKeys.length <= 1) return;

        delete schoolData[schoolName];
        if (currentSchool === schoolName) {
            let remainingSchools = Object.keys(schoolData);
            switchSchool(remainingSchools[0]);
        } else {
            renderTabs();
            saveData(); // 데이터 저장
        }
    }

    function updateCurrentSchoolName() {
        let newName = document.getElementById('currentSchoolName').value.trim();
        if (!newName) return;

        if (newName !== currentSchool) {
            if (schoolData[newName]) {
                alert("이미 존재하는 학교명입니다.");
                document.getElementById('currentSchoolName').value = currentSchool;
                return;
            }
            schoolData[newName] = schoolData[currentSchool];
            delete schoolData[currentSchool];
            currentSchool = newName;
            renderTabs();
            renderTable();
            saveData(); // 데이터 저장
        }
    }

    function updateStartNo() {
        let val = parseInt(document.getElementById('startNo').value) || 1;
        schoolData[currentSchool].startNo = val;
        renderTable();
        saveData(); // 데이터 저장
    }

    function addBatchStudents() {
        closeAllPopups();
        const rawData = document.getElementById('batchData').value;
        if (!rawData.trim()) {
            alert('입력할 데이터가 없습니다.');
            return;
        }

        const lines = rawData.split(/\r?\n/);
        let addedCount = 0;

        lines.forEach(line => {
            if (!line.trim()) return;

            let parts = line.split(/\t/).map(item => item.trim()).filter(item => item !== "");
            
            if (parts.length < 3) {
                parts = line.split(/\s+/).map(item => item.trim()).filter(item => item !== "");
            }

            if (parts.length >= 3) {
                let grade = parts[0].replace(/[^0-9]/g, '');
                let name = parts[1];
                let phone = parts[2];

                if (name && grade && phone) {
                    schoolData[currentSchool].students.push({ grade, name, phone });
                    addedCount++;
                }
            }
        });

        if (addedCount > 0) {
            document.getElementById('batchData').value = '';
            renderTable();
            showMsgPopup();
            saveData(); // 데이터 저장
        } else {
            alert('올바른 형식으로 입력되었는지 확인해주세요.\n(학년, 이름, 전화번호 순서이며 탭이나 공백으로 구분되어야 합니다)');
        }
    }

    function deleteStudent(index) {
        schoolData[currentSchool].students.splice(index, 1);
        renderTable();
        saveData(); // 데이터 저장
    }

    function clearCurrentSchoolData() {
        if (confirm(`정말 [${currentSchool}]의 모든 목록을 초기화하시겠습니까?`)) {
            schoolData[currentSchool].students = [];
            renderTable();
            saveData(); // 데이터 저장
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const currentSchoolObj = schoolData[currentSchool];
        const startNoInput = currentSchoolObj.startNo;
        
        document.getElementById('displaySchoolName').innerText = currentSchool;
        
        // 입력 폼 초기화 오류 방지
        const currentSchoolInput = document.getElementById('currentSchoolName');
        if(currentSchoolInput.value !== currentSchool) {
            currentSchoolInput.value = currentSchool;
        }
        
        const startNoEl = document.getElementById('startNo');
        if(parseInt(startNoEl.value) !== startNoInput) {
             startNoEl.value = startNoInput;
        }

        tbody.innerHTML = '';

        currentSchoolObj.students.forEach((s, index) => {
            let currentNo = startNoInput + index;
            let formattedNo = String(currentNo).padStart(2, '0');
            let autoCombined = `#${formattedNo}${currentSchool}${s.grade}학년${s.name}`;

            let row = document.createElement('tr');
            row.innerHTML = `
                <td>#${formattedNo}</td>
                <td>${currentSchool}</td>
                <td>${s.grade}학년</td>
                <td>${s.name}</td>
                <td><strong>${autoCombined}</strong></td>
                <td>${s.phone}</td>
                <td><button class="action-btn" onclick="deleteStudent(${index})">삭제</button></td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('count').innerText = currentSchoolObj.students.length;
    }

    function copyTable() {
        const table = document.getElementById('studentTable');
        let range = document.createRange();
        range.selectNode(table);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        try {
            document.execCommand('copy');
            alert('표 내용이 클립보드에 복사되었습니다.');
        } catch (err) {
            alert('복사 실패');
        }
        window.getSelection().removeAllRanges();
    }

    function downloadCSV() {
        const currentSchoolObj = schoolData[currentSchool];
        if (currentSchoolObj.students.length === 0) {
            alert('저장할 데이터가 없습니다.');
            return;
        }

        const startNoInput = currentSchoolObj.startNo;
        
        let csvContent = "\uFEFF"; 
        csvContent += "Name,Phone 1 - Value\n"; // 영문 헤더 적용

        currentSchoolObj.students.forEach((s, index) => {
            let currentNo = startNoInput + index;
            let formattedNo = String(currentNo).padStart(2, '0');
            let autoCombined = `#${formattedNo}${currentSchool}${s.grade}학년${s.name}`;
            
            csvContent += `"${autoCombined}","${s.phone}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        
        link.setAttribute('href', url);
        link.setAttribute('download', `${currentSchool}_연락처목록.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // 🚀 3. 페이지가 처음 열릴 때 저장된 데이터 불러오기 실행
    loadData();
    renderTabs();
    renderTable();
</script>

</body>
</html>
