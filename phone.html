<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방과후 코딩 학생 관리 대시보드</title>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- qrcode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCDLTlbv0NPooUV_ErqpwJLX9ayQWqE8Y8",
            authDomain: "dashboard-18022.firebaseapp.com",
            projectId: "dashboard-18022",
            storageBucket: "dashboard-18022.firebasestorage.app",
            messagingSenderId: "342705436396",
            appId: "1:342705436396:web:82fb1c31af93dc539857c9"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            window.db = db;
            window.firebaseDoc = doc;
            window.firebaseSetDoc = setDoc;
            window.firebaseGetDoc = getDoc;
            window.firebaseReady = true;
            window.dispatchEvent(new Event('firebase-ready'));
        } catch (err) { console.error('Firebase 초기화 실패:', err); }
    </script>

    <style>
        :root { --primary: #ff7675; --surface: #FFFFFF; --border: #CBD5E1; --text-main: #0F172A; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #fbc2c0 0%, #fad0c4 100%) !important; min-height: 100vh; }
        #app { padding: 20px 15px; box-sizing: border-box; }
        .container { max-width: 1500px; margin: 0 auto; background: var(--surface); border-radius: 20px; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: rgba(44, 62, 80, 0.95); color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .btn-home-circle { width: 40px; height: 40px; background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%); border-radius: 50%; border: none; color: white; cursor: pointer; }
        .tabs { display: flex; gap: 8px; padding: 15px 30px; background: #F8FAFC; border-bottom: 1px solid #CBD5E1; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: 700; color: var(--text-muted); border-radius: 10px; background: white; border: 1px solid var(--border); font-size: 15px; }
        .tab.active { background: var(--primary); color: white; border-color: transparent; }
        .content-area { padding: 25px 30px; }
        .main-table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); font-size: 14px; }
        .main-table th { background-color: #F1F5F9; padding: 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; }
        .main-table td { padding: 4px 6px; border-bottom: 1px solid #eee; border-right: 1px solid #eee; text-align: center; }
        .note-input { width: 100%; border: 1px solid #CBD5E1; border-radius: 6px; padding: 6px 10px; font-size: 13.5px; box-sizing: border-box; }
        .message-textarea { width: 100%; min-height: 350px; border: 2px solid #CBD5E1; border-radius: 12px; padding: 16px; font-size: 15px; }
        .template-panel { background: #FFFFFF; border-radius: 14px; border: 1px solid var(--border); padding: 25px 30px; margin-bottom: 25px; }
        .t-tab { padding: 8px 16px; font-weight: 800; border-radius: 6px; border: 1px solid #E2E8F0; background: #F8FAFC; color: #64748B; cursor: pointer; }
        .t-tab.active { background: #3B82F6; color: white; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; text-align: center; }
    </style>
</head>
<body>
    <div id="app">
        <!-- QR 모달 -->
        <div v-if="showQRModal" class="modal-overlay" @click.self="closeQRModal">
            <div class="modal-content">
                <h3>학부모 단체 문자 전송</h3>
                <div id="qr-code-box"></div>
                <button class="btn" style="margin-top:15px" @click="closeQRModal">닫기</button>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <div style="display:flex; align-items:center; gap:15px;">
                    <button class="btn-home-circle" @click="goToIndex"><i class="fa-solid fa-house"></i></button>
                    <h1>방과후 코딩 학생관리 대시보드</h1>
                </div>
                <button class="btn" @click="saveData">전체 저장하기</button>
            </div>
            
            <div v-if="!isLoggedIn" class="landing-container">
                <div class="landing-school-grid" style="display:flex; gap:20px; justify-content:center; padding:50px;">
                    <div class="school-card" @click="selectSchoolAndEnter('hakdong')">학동초</div>
                    <div class="school-card" @click="selectSchoolAndEnter('certification')">🏅 자격증 학생 안내</div>
                </div>
            </div>

            <div v-else>
                <div class="tabs">
                    <div class="tab" :class="{ active: currentTab === 'hakdong' }" @click="currentTab = 'hakdong'"> 학동초(화)</div>
                    <div class="tab" :class="{ active: currentTab === 'certification' }" @click="currentTab = 'certification'"> 🏅 자격증반</div>
                </div>

                <div class="content-area">
                    <!-- 템플릿 패널 -->
                    <div class="template-panel">
                        <div class="template-tabs" style="margin-bottom:10px; display:flex; gap:5px;">
                            <div v-for="(content, key) in currentSchoolTemplates" :key="key" class="t-tab" :class="{ active: activeTemplate === key }" @click="activeTemplate = key">
                                {{ getTemplateTitle(key) }}
                                <i class="fa-solid fa-xmark" @click.stop="removeTemplate(key)" style="margin-left:5px;"></i>
                            </div>
                            <div class="t-tab" @click="addNewTemplate">+ 새 양식</div>
                        </div>
                        <textarea v-if="activeTemplate" v-model="currentSchoolTemplates[activeTemplate]" class="message-textarea"></textarea>
                        <button class="btn" style="margin-top:10px;" @click="openBulkMessageQR">문자 발송 QR 생성</button>
                    </div>

                    <!-- 학생 상담 표 -->
                    <table class="main-table">
                        <thead><tr><th>No</th><th>이름</th><th>연락처</th><th>상담 특이사항</th></tr></thead>
                        <tbody>
                            <tr v-for="(s, index) in filteredStudents" :key="s.id">
                                <td>{{ index + 1 }}</td>
                                <td>{{ s.name }}</td>
                                <td>{{ s.phone }}</td>
                                <td><input type="text" v-model="s.consultationNote" class="note-input"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const isLoggedIn = ref(false);
                const currentTab = ref('hakdong');
                const students = ref([]);
                const activeTemplate = ref('first');
                const showQRModal = ref(false);
                const qrPreviewText = ref('');
                const messageTemplates = ref({ hakdong: { first: '안내문...', end: '종강...' } });

                const getTemplateTitle = (key) => key;
                const selectSchoolAndEnter = (key) => { currentTab.value = key; isLoggedIn.value = true; };
                const goToIndex = () => isLoggedIn.value = false;
                
                const filteredStudents = computed(() => students.value.filter(s => s.school === currentTab.value));

                const openBulkMessageQR = () => {
                    showQRModal.value = true;
                    nextTick(() => {
                        const qrBox = document.getElementById('qr-code-box');
                        qrBox.innerHTML = '';
                        new QRCode(qrBox, { text: "sms:010-0000-0000?body=test", width: 170, height: 170 });
                    });
                };
                
                const closeQRModal = () => showQRModal.value = false;
                const addNewTemplate = () => { /* 구현 */ };
                const removeTemplate = (key) => { delete messageTemplates.value[currentTab.value][key]; };
                const saveData = () => Swal.fire('저장 완료', '', 'success');

                onMounted(() => { /* 데이터 로드 */ });

                return { isLoggedIn, currentTab, students, activeTemplate, showQRModal, qrPreviewText, messageTemplates, getTemplateTitle, selectSchoolAndEnter, goToIndex, filteredStudents, openBulkMessageQR, closeQRModal, removeTemplate, addNewTemplate, saveData };
            }
        }).mount('#app');
    </script>
</body>
</html>
