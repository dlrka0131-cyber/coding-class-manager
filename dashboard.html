<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코딩 교구재 통합 관리 대시보드</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCDLTlbv0NPooUV_ErqpwJLX9ayQWqE8Y8",
            authDomain: "dashboard-18022.firebaseapp.com",
            projectId: "dashboard-18022",
            storageBucket: "dashboard-18022.firebasestorage.app",
            messagingSenderId: "342705436396",
            appId: "1:342705436396:web:82fb1c31af93dc539857c9"
        };
        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.firebaseDoc = doc;
            window.firebaseSetDoc = setDoc;
            window.firebaseGetDoc = getDoc;
            window.firebaseReady = true;
            window.dispatchEvent(new Event('firebase-ready'));
        } catch (err) { console.error('Firebase 초기화 실패:', err); }
    </script>

    <style>
        :root { --primary: #78649c; --surface: #FFFFFF; --border: #CBD5E1; --text-main: #0F172A; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; background: linear-gradient(135deg, #e4c588 0%, #d89679 100%); min-height: 100vh; }
        #app { min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 1550px; margin: 0 auto; background: var(--surface); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: #2c3e50; color: white; padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; }
        .tab { padding: 14px 26px; cursor: pointer; font-weight: 700; border-radius: 12px; background: white; border: 1px solid var(--border); }
        .tab.active { background: var(--primary); color: white; }
        .main-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .main-table th, .main-table td { padding: 10px; border: 1px solid var(--border); text-align: center; }
        .main-table th { background: #F1F5F9; font-weight: 800; }
        input[type="text"], select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 15px; border-radius: 8px; cursor: pointer; border: none; font-weight: 700; color: white; background: var(--primary); }
        .btn-sort { background: #475569; }
        .btn-danger { background: #EF4444; }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <h1>코딩 교구재 관리 대시보드</h1>
                <button class="btn" @click="saveData">💾 전체 저장</button>
            </div>

            <div class="content-area" style="padding: 30px;">
                <!-- 정렬 및 일괄 수정 영역 -->
                <div style="margin-bottom: 20px; display: flex; gap: 15px; align-items: center;">
                    <button class="btn btn-sort" @click="sortAllByGradeClassNum">📊 학년/반/번호순 정렬</button>
                    
                    <div style="border-left: 2px solid #eee; padding-left: 15px; display: flex; gap: 10px; align-items: center;">
                        <select v-model="batchStatusValue" style="width: 100px;">
                            <option value="DEFAULT">상태 선택</option>
                            <option value="기존">기존</option>
                            <option value="신규">신규</option>
                        </select>
                        <button class="btn" @click="applyBatchStatus">상태 일괄 적용</button>
                    </div>
                </div>

                <table class="main-table">
                    <thead>
                        <tr>
                            <th width="40"><input type="checkbox" @change="toggleAll" :checked="isAllSelected"></th>
                            <th>학년</th><th>반</th><th>번호</th><th>성명</th><th>연락처</th><th>상태</th><th>현재 단계</th><th>교구 주문</th><th>비고</th><th>삭제</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="student in filteredStudents" :key="student.id">
                            <td><input type="checkbox" v-model="selectedStudentIds" :value="student.id"></td>
                            <td><input type="text" v-model="student.grade"></td>
                            <td><input type="text" v-model="student.classNum"></td>
                            <td><input type="text" v-model="student.num"></td>
                            <td><input type="text" v-model="student.name"></td>
                            <td><input type="text" v-model="student.phone"></td>
                            <td>
                                <select v-model="student.status">
                                    <option value="기존">기존</option>
                                    <option value="신규">신규</option>
                                    <option value="삭제">삭제</option>
                                </select>
                            </td>
                            <td><input type="text" v-model="student.currentLevel" placeholder="현재 단계"></td>
                            <td>
                                <select v-model="student.item">
                                    <option value="">주문안함</option>
                                    <option v-for="item in items" :value="item">{{ item }}</option>
                                </select>
                            </td>
                            <td><input type="text" v-model="student.note"></td>
                            <td><button class="btn btn-danger" @click="removeStudent(student.id)">✖</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const students = ref([]);
                const items = ['말랑1', '말랑2', '말랑3', '말랑4', '자격증'];
                const selectedStudentIds = ref([]);
                const batchStatusValue = ref('DEFAULT');

                const filteredStudents = computed(() => students.value);
                const isAllSelected = computed(() => students.value.length > 0 && selectedStudentIds.value.length === students.value.length);

                const toggleAll = (e) => { selectedStudentIds.value = e.target.checked ? students.value.map(s => s.id) : []; };

                // 1. 학년/반/번호 순 정렬
                const sortAllByGradeClassNum = () => {
                    students.value.sort((a, b) => {
                        return (parseInt(a.grade) || 0) - (parseInt(b.grade) || 0) || 
                               (parseInt(a.classNum) || 0) - (parseInt(b.classNum) || 0) || 
                               (parseInt(a.num) || 0) - (parseInt(b.num) || 0);
                    });
                };

                // 2. 상태 일괄 적용
                const applyBatchStatus = () => {
                    if (batchStatusValue.value === 'DEFAULT') return;
                    students.value.forEach(s => {
                        if (selectedStudentIds.value.includes(s.id)) s.status = batchStatusValue.value;
                    });
                    selectedStudentIds.value = [];
                    Swal.fire('완료', '상태가 변경되었습니다.', 'success');
                };

                const removeStudent = (id) => { students.value = students.value.filter(s => s.id !== id); };

                const saveData = async () => {
                    const docRef = window.firebaseDoc(window.db, "dashboardData", "mainData");
                    await window.firebaseSetDoc(docRef, { students: students.value });
                    Swal.fire('저장 성공!', '', 'success');
                };

                onMounted(async () => {
                    if (window.firebaseReady) {
                        const docSnap = await window.firebaseGetDoc(window.firebaseDoc(window.db, "dashboardData", "mainData"));
                        if (docSnap.exists()) students.value = docSnap.data().students;
                    }
                });

                return { students, items, filteredStudents, selectedStudentIds, isAllSelected, toggleAll, sortAllByGradeClassNum, batchStatusValue, applyBatchStatus, removeStudent, saveData };
            }
        }).mount('#app');
    </script>
</body>
</html>
