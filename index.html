<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코딩 교실 통합 관리 시스템</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; font-family: 'Malgun Gothic', 'Segoe UI', sans-serif; 
            background-image: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%); 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .container {
            width: 100%; max-width: 1200px; padding: 20px; text-align: center;
        }

        .header-title-wrapper {
            margin-bottom: 10px; display: flex; align-items: center; justify-content: center;
        }
        
        .header-title {
            font-size: 3.5rem; font-weight: 900; letter-spacing: -1.5px;
            position: relative; display: inline-flex; align-items: center; justify-content: center;
            gap: 20px; padding: 15px 45px; margin: 0;
        }

        .header-title::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 60px; border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(255, 118, 117, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.6); z-index: -1;
        }

        .title-icon { font-size: 3rem; animation: float 3s ease-in-out infinite; }
        .icon-left { color: #ff7675; filter: drop-shadow(0 4px 6px rgba(255, 118, 117, 0.4)); }
        .icon-right { color: #fdcb6e; filter: drop-shadow(0 4px 6px rgba(253, 203, 110, 0.4)); animation-delay: 1.5s; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .header-title-text {
            background: linear-gradient(120deg, #ff6b6b, #6c5ce7, #0984e3, #ff6b6b);
            background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; text-fill-color: transparent;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1)); animation: shineText 4s linear infinite;
        }

        @keyframes shineText { to { background-position: 300% center; } }

        .header-sub {
            font-size: 1.3rem; color: rgba(255, 255, 255, 0.95); margin-bottom: 50px; 
            font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        .app-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; padding: 0 20px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 25px; padding: 45px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.8); position: relative; text-decoration: none;
            overflow: hidden;
        }

        .app-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), 0 15px 35px rgba(255, 118, 117, 0.2);
            border-color: #ff7675;
        }

        .app-icon-wrapper {
            width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem; color: white; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .app-card:hover .app-icon-wrapper { transform: scale(1.1) rotate(5deg); }

        .theme-seating .app-icon-wrapper { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
        .theme-supplies .app-icon-wrapper { background: linear-gradient(135deg, #00b894, #55efc4); }
        .theme-calendar .app-icon-wrapper { background: linear-gradient(135deg, #fdcb6e, #ffeaa7); color: #d35400; }
        /* 🌟 학생관리 카드 아이콘 스타일 추가 완료 🌟 */
        .theme-student .app-icon-wrapper { background: linear-gradient(135deg, #ff7675, #fab1a0); }

        .app-name { font-size: 1.6rem; font-weight: 900; color: #2d3436; margin-bottom: 12px; letter-spacing: -0.5px; }
        .app-desc { font-size: 0.95rem; font-weight: 600; color: #636e72; line-height: 1.4; word-break: keep-all; }

        .footer-note {
            margin-top: 80px; font-size: 0.95rem; color: #555; font-weight: 700;
            background: rgba(255,255,255,0.8); padding: 12px 30px; border-radius: 30px; display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5);
        }

        /* 비밀번호 모달 스타일 */
        #password-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .modal-content {
            background: white; padding: 40px 30px; border-radius: 20px;
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 90%; max-width: 400px;
        }
        .modal-content h2 { margin-top: 0; color: #2d3436; font-size: 1.5rem; margin-bottom: 15px; }
        .modal-content input {
            width: 100%; padding: 12px 15px; font-size: 1.1rem; border: 2px solid #ddd;
            border-radius: 10px; margin-bottom: 15px; outline: none; text-align: center;
        }
        .modal-content input:focus { border-color: #ff7675; }
        .modal-content button {
            width: 100%; padding: 12px; font-size: 1.1rem; background: #ff7675; color: white;
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .modal-content button:hover { background: #e85959; }
        .error-msg { color: #ff7675; font-size: 0.9rem; margin-top: 10px; display: none; }

        @media (max-width: 1000px) {
            .app-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .container { padding: 10px; }
            .header-title { font-size: 2.2rem; padding: 10px 25px; }
            .title-icon { font-size: 2rem; }
            .header-sub { font-size: 1.1rem; margin-bottom: 30px; }
            .app-grid { grid-template-columns: 1fr; gap: 20px; }
            .app-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- 비밀번호 입력 잠금 화면 -->
    <div id="password-modal">
        <div class="modal-content">
            <h2>🔒 코딩 교실 잠금</h2>
            <p style="color: #636e72; font-size: 0.95rem; margin-bottom: 20px;">비밀번호를 입력해 주세요.</p>
            <input type="password" id="pw-input" placeholder="비밀번호 입력">
            <button onclick="checkPassword()">확인</button>
            <div id="error-msg" class="error-msg">비밀번호가 틀렸습니다!</div>
        </div>
    </div>

    <div class="container">
        <div class="header-title-wrapper">
            <h1 class="header-title">
                <i class="fa-solid fa-rocket title-icon icon-left"></i>
                <span class="header-title-text">코딩 교실 통합 관리</span>
                <i class="fa-solid fa-star title-icon icon-right"></i>
            </h1>
        </div>
        <p class="header-sub">원하시는 관리 시스템을 선택해 주세요.</p>

        <div class="app-grid">
            <a href="seating.html" class="app-card theme-seating">
                <div class="app-icon-wrapper"><i class="fa-solid fa-chalkboard-user"></i></div>
                <div class="app-name">통합 자리배치</div>
                <div class="app-desc">자리배치</div>
            </a>

            <a href="dashboard.html" class="app-card theme-supplies">
                <div class="app-icon-wrapper"><i class="fa-solid fa-screwdriver-wrench"></i></div>
                <div class="app-name">교구 대쉬보드</div>
                <div class="app-desc">학생별 교구 현황</div>
            </a>

            <a href="schedule.html" class="app-card theme-calendar">
                <div class="app-icon-wrapper"><i class="fa-solid fa-calendar-alt"></i></div>
                <div class="app-name">일정 캘린더</div>
                <div class="app-desc">전체 학교 일정 관리</div>
            </a>

            <a href="student.html" class="app-card theme-student">
                <div class="app-icon-wrapper"><i class="fa-solid fa-address-book"></i></div>
                <div class="app-name">학생관리 명단</div>
                <div class="app-desc">학생관리</div>
            </a>
        </div>

        <div class="footer-note">🌸 제작 : 김정이 선생님💕</div>
    </div>

    <script>
        const correctPassword = "0131";

        window.onload = function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                document.getElementById("password-modal").style.display = "none";
            }
        };

        function checkPassword() {
            const inputVal = document.getElementById("pw-input").value;
            const errorMsg = document.getElementById("error-msg");
            const modal = document.getElementById("password-modal");

            if (inputVal === correctPassword) {
                sessionStorage.setItem("isLoggedIn", "true");
                modal.style.display = "none";
            } else {
                errorMsg.style.display = "block";
                document.getElementById("pw-input").value = "";
            }
        }

        document.getElementById("pw-input").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
</body>
</html>
