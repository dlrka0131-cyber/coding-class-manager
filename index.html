<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>코딩 교실 통합 관리 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <script src="idle-logout.js"></script>
<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCDLTlbv0NPooUV_ErqpwJLX9ayQWqE8Y8",
            authDomain: "dashboard-18022.firebaseapp.com",
            projectId: "dashboard-18022",
            storageBucket: "dashboard-18022.firebasestorage.app",
            messagingSenderId: "342705436396",
            appId: "1:342705436396:web:82fb1c31af93dc539857c9"
        };

        const ALLOWED_EMAIL = 'lalaclass31@gmail.com';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        try {
            setPersistence(auth, browserSessionPersistence).catch((e) => {
                console.warn('로그인 유지 설정 실패(무시하고 진행):', e);
            });
        } catch (e) {
            console.warn('로그인 유지 설정 실패(무시하고 진행):', e);
        }

        onAuthStateChanged(auth, (user) => {
            const overlay = document.getElementById('authGateOverlay');
            const denied = document.getElementById('authGateDenied');
            const logoutBtn = document.getElementById('authLogoutBtn');
            if (user && user.email === ALLOWED_EMAIL) {
                if (overlay) overlay.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'block';
                if (window.startIdleLogout) window.startIdleLogout(() => signOut(auth));
            } else {
                if (user) {
                    if (denied) denied.style.display = 'block';
                    signOut(auth);
                }
                if (logoutBtn) logoutBtn.style.display = 'none';
                if (overlay) overlay.style.display = 'flex';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('authGateBtn');
            if (btn) {
                btn.addEventListener('click', () => {
                    if (window.touchIdle) window.touchIdle();
                    signInWithPopup(auth, new GoogleAuthProvider()).catch((err) => {
                        console.error('로그인 실패:', err);
                        alert('로그인에 실패했습니다: ' + err.message);
                    });
                });
            }
            const logoutBtn = document.getElementById('authLogoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    signOut(auth);
                });
            }
        });
    </script>
    <style>
        #authGateOverlay {
            position: fixed; inset: 0; background: rgba(15,23,42,0.92);
            display: none; align-items: center; justify-content: center;
            z-index: 999999; color: #fff; font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
        }
        #authGateBox {
            background: #1e293b; padding: 32px 28px; border-radius: 14px; text-align: center;
            max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        #authGateBox h2 { margin: 0 0 12px; font-size: 18px; }
        #authGateBox p { margin: 0 0 20px; font-size: 13px; color: #cbd5e1; line-height: 1.5; }
        #authGateBtn {
            background: #4285F4; color: #fff; border: none; padding: 10px 20px; border-radius: 8px;
            font-weight: 600; cursor: pointer; font-size: 14px;
        }
        #authGateBtn:hover { background: #3367d6; }
        #authGateDenied { color: #f87171; font-size: 12px; margin-top: 12px; display: none; }
        #authLogoutBtn {
            position: fixed; top: 10px; right: 10px; z-index: 999998; display: none;
            background: rgba(15,23,42,0.85); color: #fff; border: 1px solid #475569;
            padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
            font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
        }
        #authLogoutBtn:hover { background: #dc2626; border-color: #dc2626; }
    </style>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: 'Pretendard', 'Malgun Gothic', 'Segoe UI', sans-serif; color: white;
            background: radial-gradient(1200px 500px at 20% 0%, #33407A 0%, transparent 60%), radial-gradient(900px 500px at 90% 100%, #5B2E6B 0%, transparent 60%), #141A33;
            background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow-x: hidden;
        }
        .star { position: fixed; width: 3px; height: 3px; border-radius: 50%; background: white; opacity: .6; pointer-events: none; animation: twinkle 4s ease-in-out infinite; }
        @keyframes twinkle { 50% { opacity: .15; } }
        @media (prefers-reduced-motion: reduce) { .star { animation: none; } }

        #authLogoutBtn {
            top: 22px; right: 28px; background: transparent; color: #C7CEEA; border: 1.5px solid rgba(255,255,255,.25);
            padding: 8px 16px; border-radius: 20px; font-size: 14.5px; font-weight: 700; font-family: inherit;
        }
        #authGateOverlay, #authGateBox { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }

        .container { width: 100%; max-width: 1200px; padding: 60px 40px 20px; text-align: center; position: relative; }
        .header-title { font-size: 46px; font-weight: 900; margin: 0 0 12px; letter-spacing: -1px; }
        .header-title em { font-style: normal; background: linear-gradient(90deg, #FFB86B, #FF7AA8); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header-sub { font-size: 17px; color: #AEB7DB; margin: 0 0 50px; }

        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; max-width: 1120px; margin: 0 auto; }
        .app-card {
            background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.14); border-radius: 22px;
            padding: 30px 22px 26px; text-align: left; text-decoration: none; color: white; display: block;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            transition: transform .2s, background .2s, border-color .2s;
        }
        .app-card:hover, .app-card:focus-visible { transform: translateY(-5px); background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.4); outline: none; }
        .app-icon-wrapper { width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 44px; color: #141A33; }
        .app-icon-wrapper svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .theme-seating .app-icon-wrapper { background: #B9A7FF; }
        .theme-supplies .app-icon-wrapper { background: #FFB86B; }
        .theme-calendar .app-icon-wrapper { background: #7BE3B4; }
        .theme-student .app-icon-wrapper { background: #7CC4FF; }
        .app-name { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
        .app-desc { font-size: 15px; color: #AEB7DB; word-break: keep-all; }

        .footer-note { margin-top: 70px; font-size: 13.5px; color: #7C86B3; }

        @media (max-width: 1000px) { .app-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) {
            .container { padding: 70px 16px 20px; }
            .header-title { font-size: 32px; }
            .header-sub { margin-bottom: 30px; }
            .app-grid { grid-template-columns: 1fr; }
            .app-icon-wrapper { margin-bottom: 22px; }
        }
    </style>
</head>
<body>
    <span class="star" style="top:12%;left:8%"></span><span class="star" style="top:22%;left:31%;animation-delay:1s"></span><span class="star" style="top:9%;left:57%;animation-delay:2s"></span><span class="star" style="top:30%;left:78%;animation-delay:.5s"></span><span class="star" style="top:16%;left:91%;animation-delay:3s"></span><span class="star" style="top:84%;left:12%;animation-delay:1.5s"></span><span class="star" style="top:90%;left:66%;animation-delay:2.5s"></span>

    <button id="authLogoutBtn">로그아웃</button>
    <div id="authGateOverlay">
      <div id="authGateBox">
        <h2>로그인이 필요합니다</h2>
        <p>선생님 전용 페이지입니다.<br>구글 계정으로 로그인해주세요.</p>
        <button id="authGateBtn">Google로 로그인</button>
        <div id="authGateDenied">이 계정은 접근 권한이 없습니다.</div>
      </div>
    </div>

    <div class="container">
        <h1 class="header-title"><em>코딩 교실</em> 통합 관리</h1>
        <p class="header-sub">원하시는 관리 시스템을 선택해 주세요.</p>

        <div class="app-grid">
            <a href="seating.html" class="app-card theme-seating">
                <div class="app-icon-wrapper"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="11" rx="2"/><path d="M8 20h8M12 15v5M7 8h6M7 11h3"/></svg></div>
                <div class="app-name">통합 자리배치</div>
                <div class="app-desc">자리배치</div>
            </a>

            <a href="dashboard.html" class="app-card theme-supplies">
                <div class="app-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg></div>
                <div class="app-name">교구 대쉬보드</div>
                <div class="app-desc">학생별 교구 현황</div>
            </a>

            <a href="schedule.html" class="app-card theme-calendar">
                <div class="app-icon-wrapper"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg></div>
                <div class="app-name">일정 캘린더</div>
                <div class="app-desc">전체 학교 일정 관리</div>
            </a>

            <a href="student.html" class="app-card theme-student">
                <div class="app-icon-wrapper"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 5a3.5 3.5 0 0 1 0 6.5M18.5 14.8c1.700.8 2.700 2.500 3 5.200"/></svg></div>
                <div class="app-name">학생관리 명단</div>
                <div class="app-desc">학생관리</div>
            </a>
        </div>

        <div class="footer-note">제작 : 김정이 선생님</div>
    </div>

</body>
</html>
